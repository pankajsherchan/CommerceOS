services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce-os-postgres
    environment:
      POSTGRES_DB: commerce_os
      POSTGRES_PASSWORD: commerce_os
      POSTGRES_USER: commerce_os
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_os -d commerce_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - commerce_os_postgres_data:/var/lib/postgresql/data

volumes:
  commerce_os_postgres_data:
